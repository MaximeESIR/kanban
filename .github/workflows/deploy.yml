name: Publish Atelier to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test -c playwright.connected.config.ts
      - run: npm run build
      - run: npx playwright test -c playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failures
          path: artifacts/
  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Temporary public demo. Supabase settings take precedence automatically.
      VITE_PUBLIC_DEMO: 'true'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check public configuration
        run: node scripts/check-config.mjs
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
